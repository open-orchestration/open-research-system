<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Research engine — live dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"
        integrity="sha512-EY3U1MWdgKx0P1dqTE4inlKz2cpXtWpsR1YUyD855Hs6RL/A0cyvrKh60EpE8wDZ814cTe1KgRK+sG0Rn792vQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#30363d; --fg:#c9d1d9; --dim:#8b949e;
          --blue:#388bfd; --pink:#f778ba; --green:#3fb950; --yellow:#d29922; --red:#f85149; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
               font:13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #app { display:grid; grid-template-columns:1fr 360px; grid-template-rows:1fr 1fr;
         gap:8px; padding:8px; box-sizing:border-box; height:100vh; }
  #cyWrap { grid-row:1 / span 2; position:relative; background:var(--panel);
            border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  #cy { width:100%; height:100%; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:6px;
           padding:10px 12px; overflow:auto; }
  h2 { margin:0 0 8px; font-size:12px; color:var(--dim); text-transform:uppercase;
       letter-spacing:.06em; display:flex; justify-content:space-between; }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px;
           background:#21262d; color:var(--fg); }
  .phase { background:var(--blue); color:#fff; }
  .row { display:flex; justify-content:space-between; padding:2px 0; gap:8px; }
  .gap { border-left:3px solid var(--line); padding:3px 0 3px 8px; margin:3px 0; }
  .gap small { color:var(--dim); }
  .s-queued { border-color:var(--yellow); }
  .s-done   { border-color:var(--green); }
  .s-failed { border-color:var(--red); }
  .meter { height:6px; background:#21262d; border-radius:3px; overflow:hidden; margin:4px 0 10px; }
  .meter > span { display:block; height:100%; background:var(--blue); }
  .log { white-space:pre; line-height:1.5; }
  .ok{color:var(--green)} .fail{color:var(--red)} .capped{color:var(--yellow)}
  #status { position:absolute; top:8px; left:12px; color:var(--dim); font-size:11px; z-index:1; }
  .muted { color:var(--dim); }
</style>
</head>
<body>
<div id="app">
  <div id="cyWrap"><div id="status">connecting…</div><div id="cy"></div></div>
  <div class="panel" id="queue"><h2>Queue <span class="badge phase" id="phase">—</span></h2>
    <div id="queueBody" class="muted">loading…</div></div>
  <div class="panel" id="loop"><h2>Loop <span class="badge" id="cycle">—</span></h2>
    <div id="loopBody" class="log muted">loading…</div></div>
</div>

<script>
/* ---------- knowledge graph (WS + snapshot) ---------- */
const cy = cytoscape({
  container: document.getElementById("cy"),
  style: [
    { selector:"node", style:{ "label":"data(id)", "font-size":8, "color":"#c9d1d9",
        "background-color":"#388bfd", "width":14, "height":14 } },
    { selector:"edge", style:{ "width":2, "line-color":"#30363d",
        "target-arrow-color":"#30363d", "target-arrow-shape":"triangle", "curve-style":"bezier" } },
    { selector:'edge[origin = "asserted"]', style:{ "line-color":"#f778ba",
        "target-arrow-color":"#f778ba", "line-style":"dashed", "width":2 } },
  ],
  layout:{ name:"grid" },
});
const status = document.getElementById("status");
let seeded = false; const buffer = [];
function addNode(id){ if (id!=null && cy.getElementById(String(id)).empty())
  cy.add({ group:"nodes", data:{ id:String(id) } }); }
function addEdge(s,t,origin){ if (s==null||t==null) return; s=String(s); t=String(t);
  const id=s+"|"+t; if (cy.getElementById(s).empty()||cy.getElementById(t).empty()) return;
  if (cy.getElementById(id).empty())
    cy.add({ group:"edges", data:{ id, source:s, target:t, origin:origin||"extracted" } }); }
function addDelta(d){ (d.new_nodes||[]).forEach(addNode); const o=d.edge_origins||{};
  (d.new_edges||[]).forEach(([s,t])=>addEdge(s,t,o[s+"|"+t])); relayout(); }
let relayoutPending=false;
function relayout(){ if (relayoutPending) return; relayoutPending=true;
  setTimeout(()=>{ relayoutPending=false; cy.layout({ name:"cose", animate:false }).run(); }, 150); }
const ws = new WebSocket("ws://" + location.host + "/ws");
ws.onmessage = (ev)=>{ const d=JSON.parse(ev.data); if (seeded) addDelta(d); else buffer.push(d); };
ws.onopen = ()=>{ status.textContent="live"; };
ws.onclose = ()=>{ status.textContent="graph stream disconnected"; };
fetch("/graph").then(r=>r.json()).then(g=>{
  (g.nodes||[]).forEach(n=>addNode(n.id));
  (g.links||g.edges||[]).forEach(e=>addEdge(e.source, e.target, e._origin));
  seeded=true; buffer.splice(0).forEach(addDelta);
  cy.layout({ name:"cose", animate:false }).run();
}).catch(()=>{ seeded=true; });

/* ---------- queue + loop (poll) ---------- */
const esc = (s)=>String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const ORDER = ["queued","failed","done"];

function renderQueue(q){
  document.getElementById("phase").textContent = q.phase || "—";
  const b = q.budget || {}, spent = (b.spent&&b.spent.sources)||0, cap = b.sources_per_cycle||0;
  const pct = cap ? Math.min(100, Math.round(100*spent/cap)) : 0;
  const groups = {}; (q.gaps||[]).forEach(g=>{ (groups[g.status]=groups[g.status]||[]).push(g); });
  const counts = ORDER.map(s=>`${s} ${(groups[s]||[]).length}`).join(" · ");
  let html = `<div class="row"><span>sources this cycle</span><span>${spent}/${cap}</span></div>`;
  html += `<div class="meter"><span style="width:${pct}%"></span></div>`;
  html += `<div class="row"><span>corpus</span><span>${q.corpus_count||0}</span></div>`;
  html += `<div class="row"><span>drafts in review</span><span>${(q.drafts||[]).length}</span></div>`;
  html += `<div class="row muted"><span>gaps</span><span>${esc(counts)}</span></div>`;
  ORDER.forEach(s=>{ (groups[s]||[]).forEach(g=>{
    html += `<div class="gap s-${esc(s)}"><div>${esc(g.desc)}</div>`+
            `<small>${esc(g.topic)} · ${esc(s)}${g.attempts?` · try ${g.attempts}`:""}</small></div>`;
  }); });
  document.getElementById("queueBody").innerHTML = html;
  document.getElementById("queueBody").classList.remove("muted");
}

function renderLoop(rows){
  const cycleEl = document.getElementById("cycle"), body = document.getElementById("loopBody");
  if (!rows.length){ cycleEl.textContent="idle"; body.className="log muted";
    body.textContent="loop idle — start it with /goal"; return; }
  const last = rows[rows.length-1];
  cycleEl.textContent = (last.cycle!=null) ? `cycle ${last.cycle}` : "running";
  body.className = "log";
  body.innerHTML = rows.slice(-40).reverse().map(r=>{
    const k = (r.cycle!=null)?`K${r.cycle}`:"--";
    const st = r.status||""; const cls = st==="ok"?"ok":st==="fail"?"fail":st?"capped":"";
    return `${k}  ${esc((r.flow||"").padEnd(12))} ${esc((r.step||"").padEnd(11))} `+
           `<span class="${cls}">${esc(st)}</span>`;
  }).join("\n");
}

async function poll(){
  try { renderQueue(await (await fetch("/queue")).json()); } catch(e){}
  try { renderLoop(await (await fetch("/runlog")).json()); } catch(e){}
}
poll(); setInterval(poll, 2000);
</script>
</body>
</html>
